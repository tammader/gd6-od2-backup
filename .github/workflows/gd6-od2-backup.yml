name: gd6-od2-backup

# gd6:老  →  od2:老   单向备份（copy：源端只读，不删不移）
#
#   * 判断幂等：目标端「同名 + 字节数一致」= 已备份 → 跳过
#   * 跨盘没有 server-side copy，rclone 只能 runner 中转：
#       - 全部走 rclone copyto：跨远端直传、全程流式，不落 runner 本地磁盘（30GB+ 也能过）
#       - streaming_over_gb 只是记账阈值，不拼任何额外 rclone 开关
#   * 单轮有 时间/文件数/总量 三道闸，到点收工，下一轮接着搬
#   * state.json 记账并 commit 回仓库（不是判断依据，判断看目标端真实状态）
#
# 需要 Secret: RCLONE_CONF —— 含 [gd6] 和 [od2] 两个 remotes 的 rclone.conf 全文

on:
  schedule:
    - cron: '15 */6 * * *'      # 每 6 小时；北京 8:15/14:15/20:15/2:15
  workflow_dispatch:
    inputs:
      apply:
        description: 'true=真拷; false=只演练(默认)'
        required: false
        default: 'false'
      only:
        description: '只处理名字含该子串的文件(调试用)'
        required: false
        default: ''
      max_gb:
        description: '本轮总量上限(GiB)，0=不限；实测 ~20 MiB/s，290 分钟能装到 ~130+'
        required: false
        default: '150'
      max_files:
        description: '本轮文件数上限，0=不限'
        required: false
        default: '0'
      budget_min:
        description: '本轮时间预算(分钟)，job 硬上限 350'
        required: false
        default: '290'
      streaming_over_gb:
        description: '超过该 GiB 走 streaming 上传(不吃磁盘)'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: gd6-od2-backup
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GO_SRC: 'gd6:老'
      GO_DST: 'od2:老'
      GO_STATE: 'state.json'
      RCLONE_CONF_PATH: '/tmp/rclone.conf'
      APPLY: ${{ github.event.inputs.apply || 'true' }}
      ONLY_NAME: ${{ github.event.inputs.only || '' }}
      MAX_GB: ${{ github.event.inputs.max_gb || '60' }}
      MAX_FILES: ${{ github.event.inputs.max_files || '0' }}
      BUDGET_MIN: ${{ github.event.inputs.budget_min || '290' }}
      STREAM_OVER: ${{ github.event.inputs.streaming_over_gb || '6' }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: 装 rclone 并落 conf
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -e
          if [ -z "$RCLONE_CONF" ]; then echo "!! 缺 Secret RCLONE_CONF"; exit 2; fi
          printf '%s' "$RCLONE_CONF" > /tmp/rclone.conf
          chmod 600 /tmp/rclone.conf
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1
          echo "remotes: $(grep -c '^\[' /tmp/rclone.conf)"
          df -h /tmp | tail -1

      - name: 备份
        run: |
          set -e
          ARGS=""
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "$ONLY_NAME" ]; then ARGS="$ARGS --only $ONLY_NAME"; fi
          python3 tools/gd6_od2_copy.py $ARGS \
            --max-gb "$MAX_GB" --max-files "$MAX_FILES" \
            --budget-min "$BUDGET_MIN" --streaming-over-gb "$STREAM_OVER"

      - name: 提交 state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "chore: gd6->od2 state $(date -u +%Y-%m-%dT%H:%M)"
            for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; echo retry $i; sleep 5; done
          fi
